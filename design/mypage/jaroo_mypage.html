<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jaroo — 마이페이지</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,'Pretendard',sans-serif;-webkit-font-smoothing:antialiased}
body{background:#e8e8e8;display:flex;justify-content:center;gap:16px;flex-wrap:wrap;padding:20px;min-height:100vh;align-items:flex-start}
.frame{background:#F5F6F8;border-radius:16px;width:340px;height:760px;overflow-y:auto;overflow-x:hidden;box-shadow:0 4px 24px rgba(0,0,0,.12);position:relative}
.frame::-webkit-scrollbar{display:none}
.caption{width:340px;text-align:center;font-size:12px;color:#555;margin-top:8px;font-weight:600}
svg{display:block}

.top{padding:16px 16px 8px}
.top-title{font-size:20px;font-weight:700;color:#0F1419}
.body{padding:8px 16px 24px}

/* 프로필 */
.profile{display:flex;align-items:center;gap:13px;background:#fff;border-radius:14px;border:.5px solid #E8EAEE;box-shadow:0 1px 3px rgba(0,0,0,.04);padding:16px;margin-bottom:14px}
.avatar{width:48px;height:48px;border-radius:50%;background:#0F1419;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;font-weight:700;flex-shrink:0}
.pf-info{flex:1;min-width:0}
.pf-name{font-size:15px;font-weight:600;color:#0F1419}
.pf-email{font-size:11.5px;color:#97A0AE;margin-top:2px}
.pf-provider{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;color:#5A6473;background:#F2F3F6;padding:3px 8px;border-radius:5px;margin-top:6px}
.pf-edit{font-size:12px;color:#0F1419;font-weight:500}

/* 크레딧 */
.credit-card{background:#fff;border:.5px solid #E8EAEE;box-shadow:0 1px 3px rgba(0,0,0,.04);border-radius:16px;padding:18px;margin-bottom:14px}
.credit-label{font-size:11px;color:#97A0AE;margin-bottom:6px;font-weight:500}
.credit-amt{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.credit-amt span{font-size:26px;font-weight:800}
.credit-sub{font-size:11px;color:#97A0AE;margin-top:5px}
.credit-btn{margin-top:14px;width:100%;padding:11px;border-radius:10px;background:#0F1419;border:none;color:#fff;font-size:12.5px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}

/* Pro */
.pro-card{background:#fff;border-radius:14px;border:.5px solid #E8EAEE;box-shadow:0 1px 3px rgba(0,0,0,.04);padding:15px 16px;margin-bottom:20px;display:flex;align-items:center;gap:12px}
.pro-mark{width:38px;height:38px;border-radius:10px;background:#0F1419;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pro-info{flex:1}
.pro-title{font-size:13.5px;font-weight:600;color:#0F1419}
.pro-desc{font-size:11px;color:#97A0AE;margin-top:2px}
.pro-btn{font-size:11.5px;font-weight:600;color:#fff;background:#0F1419;padding:8px 13px;border-radius:9px;cursor:pointer;flex-shrink:0}

/* 메뉴 */
.menu-label{font-size:11px;color:#97A0AE;letter-spacing:.04em;font-weight:500;margin:0 0 8px 4px}
.menu-group{background:#fff;border-radius:14px;border:.5px solid #E8EAEE;box-shadow:0 1px 3px rgba(0,0,0,.04);overflow:hidden;margin-bottom:20px}
.menu-item{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:.5px solid #EFF1F4;cursor:pointer}
.menu-item:last-child{border-bottom:none}
.mi-ico{width:20px;height:20px;display:flex;align-items:center;justify-content:center;color:#5A6473;flex-shrink:0}
.mi-label{flex:1;font-size:13.5px;color:#0F1419}
.mi-value{font-size:12px;color:#97A0AE;font-variant-numeric:tabular-nums}
.mi-arrow{color:#C2C8D0;flex-shrink:0}
.mi-toggle{width:40px;height:23px;border-radius:12px;background:#0F1419;position:relative;flex-shrink:0}
.mi-toggle::after{content:'';position:absolute;top:2px;right:2px;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.mi-toggle.off{background:#D8DCE2}
.mi-toggle.off::after{right:auto;left:2px}
.mi-label.danger{color:#2B6BE6}
.mi-ico.danger{color:#2B6BE6}

.version{text-align:center;font-size:10.5px;color:#B8C0CA;margin-top:8px}

.tabbar{position:sticky;bottom:0;display:flex;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:.5px solid #E8EAEE;padding:9px 0 11px}
.tab{flex:1;text-align:center;font-size:10px;color:#97A0AE;display:flex;flex-direction:column;align-items:center;gap:4px}
.tab.on{color:#0F1419;font-weight:600}
.tab .ti{display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>

<div>
<div class="frame">
  <div class="top"><div class="top-title">마이</div></div>
  <div class="body">
    <!-- 프로필 -->
    <div class="profile">
      <div class="avatar">양</div>
      <div class="pf-info">
        <div class="pf-name">양호식</div>
        <div class="pf-email">hosik@example.com</div>
        <div class="pf-provider">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
          이메일 로그인
        </div>
      </div>
      <div class="pf-edit">편집</div>
    </div>

    <!-- 크레딧 -->
    <div class="credit-card">
      <div class="credit-label">지금 이용 가능</div>
      <div class="credit-amt" style="color:#0F1419">딥스캔 <span style="color:#0F1419">4</span>회</div>
      <div class="credit-sub">스캔은 12회 · 보유 크레딧 1,200</div>
      <button class="credit-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        크레딧 충전
      </button>
    </div>

    <!-- Pro -->
    <div class="pro-card">
      <div class="pro-mark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="#fff"><path d="M12 2l2.9 6.3 6.9.7-5.1 4.6 1.4 6.8L12 17.3 5.9 20.4l1.4-6.8L2.2 9l6.9-.7z"/></svg>
      </div>
      <div class="pro-info">
        <div class="pro-title">Jaroo Pro</div>
        <div class="pro-desc">딥스캔 무제한 · 월 4,900원</div>
      </div>
      <div class="pro-btn">시작하기</div>
    </div>

    <!-- 포트폴리오 -->
    <div class="menu-label">포트폴리오</div>
    <div class="menu-group">
      <div class="menu-item">
        <span class="mi-ico"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><rect x="7" y="12" width="3" height="6"/><rect x="12" y="8" width="3" height="10"/><rect x="17" y="5" width="3" height="13"/></svg></span>
        <span class="mi-label">내 종목 관리</span>
        <span class="mi-value">3종목</span>
        <span class="mi-arrow"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></span>
      </div>
      <div class="menu-item">
        <span class="mi-ico"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M12 8v8M8 12h8"/></svg></span>
        <span class="mi-label">스크린샷으로 종목 추가</span>
        <span class="mi-arrow"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></span>
      </div>
      <div class="menu-item">
        <span class="mi-ico"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></span>
        <span class="mi-label">분석 기록</span>
        <span class="mi-arrow"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></span>
      </div>
    </div>

    <!-- 알림 -->
    <div class="menu-label">알림</div>
    <div class="menu-group">
      <div class="menu-item">
        <span class="mi-ico"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></span>
        <span class="mi-label">분석 완료 알림</span>
        <div class="mi-toggle"></div>
      </div>
      <div class="menu-item">
        <span class="mi-ico"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 17l-8.5-8.5-5 5L2 7"/><path d="M16 17h6v-6"/></svg></span>
        <span class="mi-label">급락 종목 알림</span>
        <div class="mi-toggle"></div>
      </div>
      <div class="menu-item">
        <span class="mi-ico"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg></span>
        <span class="mi-label">마케팅 정보 수신</span>
        <div class="mi-toggle off"></div>
      </div>
    </div>

    <!-- 기타 -->
    <div class="menu-label">기타</div>
    <div class="menu-group">
      <div class="menu-item">
        <span class="mi-ico"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h8"/></svg></span>
        <span class="mi-label">서비스 약관</span>
        <span class="mi-arrow"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></span>
      </div>
      <div class="menu-item">
        <span class="mi-ico"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
        <span class="mi-label">개인정보처리방침</span>
        <span class="mi-arrow"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></span>
      </div>
      <div class="menu-item">
        <span class="mi-ico"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>
        <span class="mi-label">문의하기</span>
        <span class="mi-arrow"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></span>
      </div>
      <div class="menu-item">
        <span class="mi-ico"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg></span>
        <span class="mi-label">로그아웃</span>
        <span class="mi-arrow"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></span>
      </div>
      <div class="menu-item">
        <span class="mi-ico danger"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></span>
        <span class="mi-label danger">회원 탈퇴</span>
        <span class="mi-arrow"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></span>
      </div>
    </div>

    <div class="version">Jaroo v1.0.3</div>
  </div>

  <div class="tabbar">
    <div class="tab"><span class="ti"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg></span>홈</div>
    <div class="tab"><span class="ti"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></span>포트폴리오</div>
    <div class="tab"><span class="ti"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M19 9l-5 5-4-4-3 3"/></svg></span>분석</div>
    <div class="tab on"><span class="ti"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg></span>마이</div>
  </div>
</div>
<div class="caption">마이페이지 — SVG 아이콘 · v7 톤 절제</div>
</div>

</body>
</html>
