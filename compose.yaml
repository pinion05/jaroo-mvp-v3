name: jaroo-mvp-v3

x-jaroo-build: &jaroo-build
  context: .
  dockerfile: Dockerfile
  target: runner

x-jaroo-app: &jaroo-app
  restart: unless-stopped
  environment: &jaroo-env
    NODE_ENV: production
    WITH_LOCAL_ENV_PROCESS_PRECEDENCE: "1"
    TICKER_MAP_REPO_ROOT: /app/packages/instrument-core
    QUOTES_CURRENT_PROXY_TIMEOUT_MS: "15000"
  volumes:
    - ./.env.local:/app/.env.local:ro
    - ./.env.cookie:/app/.env.cookie:ro

services:
  crawler:
    <<: *jaroo-app
    image: jaroo-mvp-v3-crawler:local
    build: *jaroo-build
    command: ["node", "scripts/with-local-env.cjs", "node", "packages/crawler/src/server.js"]
    environment:
      <<: *jaroo-env
      PORT: "3040"
    ports:
      - "3040:3040"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3040/api/source/system/catalog').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    <<: *jaroo-app
    image: jaroo-mvp-v3-web:local
    build: *jaroo-build
    command: ["node", "scripts/with-local-env.cjs", "node_modules/.bin/next", "start"]
    environment:
      <<: *jaroo-env
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      JAROO_CRAWLER_BASE_URL: http://crawler:3040
    ports:
      - "3000:3000"
    depends_on:
      crawler:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
